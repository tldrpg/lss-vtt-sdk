<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vortex Logger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      }

      *::-webkit-scrollbar { width: 4px; height: 4px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

      body {
        font-family: 'Roboto', system-ui, -apple-system, sans-serif;
        background: transparent;
        color: #fff;
        height: 100vh;
        overflow: hidden;
      }

      #app {
        height: 100%;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
      }

      /* ── Logger content (Vortex iframe) ── */
      .content {
        position: absolute;
        bottom: var(--pill-height, 44px);
        right: 0;
        height: calc(100% - var(--pill-height, 44px));
        width: 100%;
        display: none;
        flex-direction: column;
        overflow: hidden;
      }

      .content.expanded { display: flex; }

      .content iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
      }

      /* ── Settings panel ── */
      .settings {
        position: absolute;
        bottom: var(--pill-height, 44px);
        right: 0;
        height: auto;
        width: 100%;
        display: none;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
        overflow-y: auto;
        background: rgba(24, 27, 37, 0.96);
        backdrop-filter: blur(12px);
      }

      .settings.expanded { display: flex; }

      .settings-section {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .settings-label {
        font-size: 10px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: rgba(255, 255, 255, 0.35);
      }

      .settings-value {
        font-size: 12px;
        font-family: monospace;
        color: rgba(255, 255, 255, 0.75);
        word-break: break-all;
        line-height: 1.5;
      }

      .settings-value.empty {
        color: rgba(255, 255, 255, 0.3);
        font-style: italic;
        font-family: inherit;
      }

      .reset-btn {
        margin-top: auto;
        padding: 8px 14px;
        background: rgba(224, 49, 49, 0.15);
        border: 1px solid rgba(224, 49, 49, 0.35);
        border-radius: 6px;
        color: #ff8080;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        text-align: left;
        transition: background 0.15s;
      }

      .reset-btn:hover { background: rgba(224, 49, 49, 0.28); }

      /* ── Preview card ── */
      .preview-card {
        position: absolute;
        bottom: var(--pill-height, 44px);
        right: 0;
        width: 100%;
        padding: 8px 10px;
        display: none;
        flex-direction: column;
      }

      .preview-inner {
        background: rgba(30, 34, 49, 0.97);
        backdrop-filter: blur(12px);
        border-radius: 8px;
        border-left: 3px solid var(--char-color, #4a9eff);
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        box-shadow: rgba(0,0,0,0.3) 0 4px 16px;
      }

      .preview-inner.crit-success { border-left-color: #2f9e44; }
      .preview-inner.crit-failure { border-left-color: #e03131; }

      .preview-author {
        font-size: 11px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .preview-body {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .preview-title-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }

      .preview-title {
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.92);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .preview-subtitle {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.45);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .preview-total {
        font-size: 24px;
        font-weight: 700;
        color: var(--char-color, #4a9eff);
        flex-shrink: 0;
        line-height: 1;
      }

      /* ── Bottom pill bar ── */
      .pills {
        position: absolute;
        bottom: 8px;
        right: 0;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .pill {
        color: #fff;
        background-color: rgba(30, 34, 49, 0.6);
        box-shadow: rgba(0,0,0,0.2) 0 2px 1px -1px, rgba(0,0,0,0.14) 0 1px 1px 0, rgba(0,0,0,0.12) 0 1px 3px 0;
        backdrop-filter: blur(10px);
        background-image: linear-gradient(rgba(255,255,255,0.05), rgba(255,255,255,0.05));
        border-radius: 20px;
        height: 36px;
        font-family: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.03333em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        outline: none;
        border: 0;
        cursor: pointer;
        padding: 0 14px;
        white-space: nowrap;
        transition: background-color 250ms cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }

      .pill:hover { background-color: rgba(255, 255, 255, 0.08); }

      .pill-icon {
        font-size: 18px;
        padding: 0 10px;
        font-style: normal;
        width: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Unread badge ── */
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        background: #8c2e2e;
        border-radius: 8px;
        font-size: 10px;
        font-weight: 700;
        line-height: 1;

        position: absolute;
        top: 0;
        right: 0;
        transform: translate(5%, -30%);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="content" class="content"></div>
      <div id="settings" class="settings"></div>
      <div id="preview-card" class="preview-card"></div>
      <div class="pills">
        <button id="pill-settings" class="pill pill-icon" title="Настройки">⚙</button>
        <button id="pill" class="pill">
          История событий
          <span id="unread-badge" class="badge" style="display:none">0</span>
        </button>
      </div>
    </div>
    <script type="module" src="./src/logger.ts"></script>
  </body>
</html>
